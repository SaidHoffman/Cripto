{% extends "base_generic.html" %}

{% block content %}
<div class="max-w-md mx-auto mt-12 bg-white dark:bg-dark-800 shadow-lg rounded-2xl p-8 space-y-6 text-center">

  <div class="flex justify-center">
    <div class="w-16 h-16 bg-green-100 dark:bg-green-800 text-green-600 dark:text-green-300 rounded-full flex items-center justify-center">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2l4-4m5 2a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    </div>
  </div>

  <h2 class="text-xl font-bold text-gray-800 dark:text-gray-100">
    ¡Correo enviado!
  </h2>

  <p class="text-gray-700 dark:text-gray-300">
    Te hemos enviado un correo con instrucciones para restablecer tu contraseña.
    Revisa tu bandeja de entrada o carpeta de spam.
  </p>

  <div>
    <a href="{% url 'login' %}" class="inline-block mt-4 px-5 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg shadow transition duration-200">
      ← Volver al inicio de sesión
    </a>
  </div>
</div>
{% endblock %}
